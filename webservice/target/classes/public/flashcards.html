<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - NONG MALI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Canva Sans', 'Bricolage Grotesque', sans-serif;
        }

        body {
            background: #fbf3eb;
            min-height: 100vh;
        }

        /* NAVIGATION */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #000;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #000;
            font-size: 18px;
            font-weight: 500;
        }

        a.login-btn {
            background: #b41f7d;
            color: white;
            padding: 12px 30px;
            border-radius: 40px;
            box-shadow: 0 4px 12px rgba(180, 31, 125, 0.3);
            text-decoration: none;
            font-weight: 600;
        }

        /* PAGE TITLE */
        .title-section {
            text-align: center;
            margin-top: 40px;
        }

        .title-section h1 {
            font-size: 48px;
            font-weight: 800;
            color: #3a2b23;
        }

        .title-section p {
            font-size: 20px;
            margin-top: 12px;
            color: #7c665c;
        }

        /* FLASHCARD GRID */
        .flashcard-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 60px;
            padding-bottom: 80px;
        }

        /* CARD STYLE */
        .card {
            width: 260px;
            height: 360px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.7s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: #fff;
            border-radius: 26px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .front-text {
            font-size: 42px;
            color: #3a2b23;
            font-weight: 700;
            text-align: center;
            line-height: 1.2;
        }

        .click-text {
            margin-top: 18px;
            color: #8a6d63;
            font-size: 16px;
        }

        .card-back {
            background: #35c9d1;
            color: white;
            transform: rotateY(180deg);
            font-size: 34px;
            font-weight: 700;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .flashcard-container {
                flex-direction: column;
                align-items: center;
                gap: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <nav>
        <div class="logo">NONG MALI</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="flashcards.html">Play game</a></li>
            <li><a href="login.html" class="login-btn" id="authBtn">Login</a></li>
        </ul>
    </nav>

    <!-- TITLE -->
    <div class="title-section">
        <h1>Try Our Flashcards</h1>
        <p>Click on any card to flip it and see the translation!</p>
    </div>

    <!-- FLASHCARDS -->
    <div class="flashcard-container">

        <!-- CARD 1 -->
        <div class="card">
            <div class="card-inner">
                <div class="card-face card-front">
                    <div class="front-text">สวัสดี</div>
                    <div class="click-text">Click to flip</div>
                </div>
                <div class="card-face card-back">
                    Hello
                </div>
            </div>
        </div>

        <!-- CARD 2 -->
        <div class="card">
            <div class="card-inner">
                <div class="card-face card-front">
                    <div class="front-text">ขอบคุณ</div>
                    <div class="click-text">Click to flip</div>
                </div>
                <div class="card-face card-back">
                    Thank you
                </div>
            </div>
        </div>

        <!-- CARD 3 -->
        <div class="card">
            <div class="card-inner">
                <div class="front-text card-face card-front">
                    ยินดีที่ได้<br>รู้จัก
                    <div class="click-text">Click to flip</div>
                </div>
                <div class="card-face card-back">
                    Nice to meet you
                </div>
            </div>
        </div>

    </div>

    <script>
        /* --------------------------
           🔒 LOGIN REQUIRED
        ----------------------------*/
        const token = localStorage.getItem("token");
        if (!token) {
            window.location.href = "login.html";
        }

        /* --------------------------
           🂠 Flashcard Flip Logic
        ----------------------------*/
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', () => {
                card.classList.toggle('flipped');
            });
        });

        /* --------------------------
           👤 Navbar Login/Logout
        ----------------------------*/
        const username = localStorage.getItem('username');
        const authBtn = document.getElementById('authBtn');

        if (username) {
            authBtn.textContent = "Logout";
            authBtn.onclick = function () {
                localStorage.removeItem('username');
                localStorage.removeItem('token');
                window.location.href = "login.html";
            };
        }
    </script>

</body>
</html>
