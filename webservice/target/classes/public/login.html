<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawaii Login</title>
    <link rel="stylesheet" href="index_style.css">
    </head>
<body>
    <div class="login-container">
        <div class="image-placeholder">
            <img src="bunny.png" alt="Cute Bunny Mascot" class="mascot-image">
            </div>

        <form id="loginForm" class="login-form">
            <div class="input-group">
                <img class="icon" width="24px" src="inbox_icon.svg" alt="My SVG Image">
                 <input type="text" id="username" placeholder="Username or the email address" aria-label="Email address">
            </div>

            <div class="input-group">
                <img class="icon" width="24px" src="password_icon.svg" alt="My SVG Image">
                <input type="password" id="password" placeholder="Enter password" aria-label="Password">
            </div>

            <button type="submit" class="login-button">
                LOGIN
            </button>
            
            <p class="forgot-password">
                Forgot Password? <a href="#">Click Here</a>
            </p>
        </form>
    </div>
</body>
<script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault(); // stop default form submit
    
        const data = {
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
        };
    
        fetch("http://localhost:8080/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(result => {
            console.log(result);
            window.location.href = "/welcome.html";
        })
        .catch(err => console.error("Fetch error:", err));
    });
    </script>
    
</html>
