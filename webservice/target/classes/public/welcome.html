<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THAIFLIP FUN - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Canva Sans', Bricolage Grotesque , sans-serif;
            background: linear-gradient(135deg, #f8eee6 0%, #f8eee6 50%, #ffbde9 100%);
            min-height: 100vh;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
            background: transparent;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #000000;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            align-items: center;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #000000;
            font-size: 18px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #b41f7d;
        }

        .login-btn {
            background: linear-gradient(135deg, #b41f7d 0%, #b41f7d 100%);
            color: white;
            padding: 12px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
        }

        .logout-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .logout-btn:hover {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        /* Hero Section */
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 80px 60px;
            max-width: 1400px;
            margin: 0 auto;
            gap: 60px;
        }

        .hero-content {
            flex: 1;
            max-width: 600px;
        }

        .hero-content h1 {
            font-size: 64px;
            font-weight: 800;
            color: #000000;
            line-height: 1.2;
            margin-bottom: 30px;
        }

        .hero-content .highlight {
            display: block;
            font-size: 72px;
        }

        .hero-content p {
            font-size: 20px;
            color: #000000;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .username-display {
            font-weight: 700;
            color: #a855f7;
            font-size: 22px;
        }

        .hero-image {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .bunny-character {
            width: 100%;
            max-width: 450px;
            height: auto;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.1));
        }

        /* File upload for custom character */
        .upload-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .upload-placeholder {
            width: 400px;
            height: 400px;
            border: 3px dashed #c4a9cc;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.5);
        }

        .upload-placeholder:hover {
            border-color: #a855f7;
            background: rgba(255, 255, 255, 0.7);
        }

        .upload-placeholder svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        #characterUpload {
            display: none;
        }

        .character-display {
            display: none;
        }

        .character-display.active {
            display: block;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .hero {
                flex-direction: column;
                text-align: center;
                padding: 60px 40px;
            }

            .hero-content h1 {
                font-size: 48px;
            }

            .hero-content .highlight {
                font-size: 56px;
            }

            nav {
                padding: 20px 40px;
            }

            .nav-links {
                gap: 20px;
            }
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }

            .nav-links {
                flex-direction: column;
                gap: 15px;
            }

            .hero-content h1 {
                font-size: 36px;
            }

            .hero-content .highlight {
                font-size: 42px;
            }

            .hero-content p {
                font-size: 18px;
            }

            .bunny-container {
                width: 300px;
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="logo">NONG MALI</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="flashcards.html">Play game</a></li>
            <li><a href="#" class="login-btn logout-btn" onclick="logout()" id="authBtn">Login</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <div class="hero">
        <div class="hero-content">
            <h1>
                Welcome to
                <span class="highlight">THAIFLIP FUN</span>
            </h1>
            <p>
                <span id="welcomeMessage">Learn Thai the fun way with interactive flashcards! Join Nong-Mali on an exciting language learning adventure.</span>
            </p>
            <a href="flashcards.html" class="login-btn">Start Learning</a>
        </div>

        <div class="hero-image">
            <div class="upload-container">
                <img id="characterImage" class="bunny-character character-display" src="" alt="Cute Bunny Character">
                <label for="characterUpload" class="upload-placeholder" id="uploadPlaceholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <span>Click to upload your bunny character</span>
                    <span style="font-size: 14px; margin-top: 10px;">Or it will use your character automatically</span>
                </label>
                <input type="file" id="characterUpload" accept="image/*">
            </div>
        </div>
    </div>

    <script>
        // Check if user is logged in
        const username = localStorage.getItem('username');
        const authBtn = document.getElementById('authBtn');
        const welcomeMessage = document.getElementById('welcomeMessage');

        if (username) {
            authBtn.textContent = 'Logout';
            authBtn.classList.add('logout-btn');
            welcomeMessage.innerHTML = `Welcome back, <span class="username-display">${username}</span>! Ready to continue your Thai learning journey?`;
        } else {
            authBtn.textContent = 'Login';
            authBtn.classList.remove('logout-btn');
            authBtn.onclick = () => window.location.href = 'login.html';
        }

        function logout() {
            if (username) {
                localStorage.removeItem('username');
                localStorage.removeItem('token');
                window.location.reload();
            } else {
                window.location.href = 'login.html';
            }
        }

        // Character image upload and display
        const characterUpload = document.getElementById('characterUpload');
        const characterImage = document.getElementById('characterImage');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');

        // Load saved character or show placeholder
        const savedCharacter = localStorage.getItem('characterImage');
        if (savedCharacter) {
            characterImage.src = savedCharacter;
            characterImage.classList.add('active');
            uploadPlaceholder.style.display = 'none';
        }

        characterUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    characterImage.src = event.target.result;
                    characterImage.classList.add('active');
                    uploadPlaceholder.style.display = 'none';
                    // Save to localStorage
                    localStorage.setItem('characterImage', event.target.result);
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
