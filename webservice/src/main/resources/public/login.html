<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peppo Login</title>
  <style>
    /* 🎨 Global Styling & Background */
    body {
      /* Soft pastel purple/blue gradient background from reference image */
      background: linear-gradient(135deg, #a7b7e8 0%, #d4a7e8 100%); 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #333;
      transition: background 0.5s ease;
      position: relative; 
      overflow: hidden;
    }

    /* ⬅️ Top Left Navigation */
    .back-link {
        position: absolute;
        top: 40px;
        left: 40px;
        color: #fff; 
        text-decoration: none;
        font-size: 0.9em;
        font-weight: 500;
        letter-spacing: 0.5px;
        opacity: 0.8;
        transition: opacity 0.2s;
    }
    
    .back-link:hover {
        opacity: 1;
    }

    /* 📦 Login Card Container (Opaque White) */
    .login-container {
      background: #ffffff; 
      padding: 50px 40px; 
      border-radius: 15px;
      box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.08); 
      border: none;
      width: 100%;
      max-width: 380px;
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    /* 👤 Logo/Name Section */
    .logo-name {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 25px;
        color: #6a1b9a; 
        font-weight: 600;
        letter-spacing: 1px;
    }

    .logo-name .icon {
        font-size: 20px;
        margin-right: 8px;
    }
    
    h2 { display: none; } 

    /* 💬 Greeting Text */
    .greeting-title {
        color: #333;
        font-size: 1.6em;
        font-weight: 600;
        margin-bottom: 5px;
    }

    .greeting-subtitle {
        color: #777;
        font-size: 0.9em;
        margin-bottom: 30px;
        line-height: 1.4;
    }

    /* 🏷️ Input Label & Fields */
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    
    .input-group label {
        display: block;
        font-size: 0.9em;
        font-weight: 600;
        color: #555;
        margin-bottom: 5px;
    }

    .input-field-container {
        position: relative;
    }

    .input-icon {
        position: absolute;
        top: 50%;
        right: 15px;
        transform: translateY(-50%);
        color: #aaa;
        font-size: 18px;
        cursor: pointer;
    }
    
    /* Input fields (now using IDs 'username' and 'password') */
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px; 
      background: #fcfcfc;
      color: #333;
      box-sizing: border-box;
      font-size: 16px;
      transition: all 0.2s ease;
      margin-top: 0; 
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #9c27b0; 
      box-shadow: 0 0 0 1px rgba(156, 39, 176, 0.3);
      background: #fff;
    }
    
    /* Remove input icon placeholder for username input */
    .input-group:first-of-type input[type="text"] {
        padding-right: 15px; 
    }
    
    /* 📝 Remember Me / Forgot Password Layout */
    .options-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        font-size: 0.9em;
    }
    
    .remember-me {
        display: flex;
        align-items: center;
        color: #555;
    }
    
    .remember-me input[type="checkbox"] {
        margin-right: 8px;
    }
    
    .forgot-password a {
        color: #9c27b0; 
        text-decoration: none;
        font-weight: 500;
    }

    /* 👆 Primary Sign In Button */
    .primary-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background-color: #673ab7; 
      color: #fff;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      margin-top: 5px; 
      box-shadow: 0 4px 10px rgba(103, 58, 183, 0.4);
      transition: all 0.3s ease;
      text-transform: none; 
      letter-spacing: normal;
    }

    .primary-button:hover {
      background-color: #5e35b1;
      box-shadow: 0 6px 15px rgba(103, 58, 183, 0.6);
      transform: translateY(-1px);
    }
    
    /* 🔑 Google Sign In Button */
    .google-button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fff;
        color: #555;
        font-size: 1em;
        font-weight: 500;
        cursor: pointer;
        margin-top: 15px;
        transition: all 0.2s;
    }
    
    .google-button:hover {
        border-color: #c5cae9;
        background: #f5f5f5;
    }
    
    .google-icon {
        font-size: 20px;
        margin-right: 8px;
        color: #db4437; 
    }

    /* 🆕 Sign Up Link */
    .signup-footer {
        margin-top: 30px;
        font-size: 0.9em;
        color: #777;
    }
    
    .signup-footer a {
        color: #673ab7; 
        font-weight: 600;
        text-decoration: none;
    }
    
    /* 🖥️ Output Styling (Kept for function testing) */
    #output {
      margin-top: 30px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 10px;
      white-space: pre-wrap;
      text-align: left;
      font-family: Consolas, monospace;
      color: #90ee90;
      min-height: 40px;
      overflow-x: auto;
    }

    /* 💫 Keyframe Animations (Kept) */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

  </style>
</head>
<body>
  
  <a href="#" class="back-link">&lt; Home page</a>

  <div class="login-container">
    <div class="logo-name">
        <span class="icon">&#9825;</span> 
        PEPPO
    </div>
    
    <div class="greeting-title">Welcome Back!</div>
    <div class="greeting-subtitle">We missed you! Please enter your details.</div>
    
    <form id="loginForm">
      
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your Username" required>
      </div>
      
      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-field-container">
            <input type="password" id="password" placeholder="Enter Password" required>
            <span class="input-icon" onclick="togglePasswordVisibility(this)">&#128065;</span> 
        </div>
      </div>
      
      <div class="options-row">
          <div class="remember-me">
              <input type="checkbox" id="rememberMe">
              <label for="rememberMe">Remember me</label>
          </div>
          <div class="forgot-password">
              <a href="#">Forgot password?</a>
          </div>
      </div>
      
      <button type="submit" class="primary-button">Sign In</button>
      
      <button type="button" class="google-button">
          <span class="google-icon">G</span>
          Sign in with google
      </button>
      
    </form>
    
    <div class="signup-footer">
        Don't have an account? <a href="#">Sign up</a>
    </div>
  </div>

  <pre id="output"></pre>

  <script>
    // ** JavaScript Logic (FIXED to use 'username' ID) **
    
    function togglePasswordVisibility(toggleElement) {
        const passwordInput = toggleElement.previousElementSibling;
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
    }
    
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      // FIXED: Get value from the 'username' input ID
      const username = document.getElementById("username").value.trim(); 
      const password = document.getElementById("password").value.trim();
      const output = document.getElementById("output");
      
      // Clear any previous error glow
      const loginContainer = document.querySelector('.login-container');
      loginContainer.style.boxShadow = '0 10px 30px 0 rgba(0, 0, 0, 0.08)'; 
      
      output.textContent = "Sending request...";

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          // FIXED: Send 'username' in the JSON body
          body: JSON.stringify({ username, password }) 
        });

        const text = await res.text();
        output.textContent = `Status: ${res.status}\n\n${text}`;
        
        if (res.status === 200) {
          try {
            // Success visual feedback
            loginContainer.style.boxShadow = '0 0 20px 5px rgba(103, 58, 183, 0.4)';
            const data = JSON.parse(text);
            localStorage.setItem('username', data.username); // Store 'username'
            localStorage.setItem('token', data.token);
            setTimeout(() => {
                window.location.href = 'welcome.html';
            }, 1000);
          } catch (e) {
            output.textContent += '\nError parsing response.';
            // Error visual feedback
            loginContainer.style.boxShadow = '0 0 20px 5px rgba(255, 0, 0, 0.4)';
          }
        } else {
            loginContainer.style.boxShadow = '0 0 20px 5px rgba(255, 0, 0, 0.4)';
        }
      } catch (err) {
        output.textContent = "Error: Network connection failed. " + err;
        loginContainer.style.boxShadow = '0 0 20px 5px rgba(255, 0, 0, 0.4)';
      }
    });
  </script>
</body>
</html>
