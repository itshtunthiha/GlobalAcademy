<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/index-style.css">
</head>

<body>
    <div class="login-container">
        <div class="image-placeholder">
            <img src="imgs/bunny.png" alt="Cute Bunny Mascot" class="mascot-image">
        </div>

        <form id="loginForm" class="login-form">
            <div class="input-group">
                <img class="icon" src="icons/inbox-icon.svg" alt="Email Icon">
                <input type="text" id="username" placeholder="Username or email address" aria-label="Email address">
            </div>

            <div class="input-group">
                <img class="icon" src="icons/password-icon.svg" alt="Password Icon">
                <input type="password" id="password" placeholder="Enter password" aria-label="Password">
            </div>

            <button type="submit" class="login-button">
                LOGIN
            </button>

            <p class="forgot-password">
                Forgot Password? <a href="#">Click Here</a>
            </p>

            <p id="errorMessage" class="error-message">
                Invalid username or password
            </p>
        </form>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const errorMessage = document.getElementById("errorMessage");
            errorMessage.style.display = "none";

            const data = {
                username: document.getElementById("username").value.trim(),
                password: document.getElementById("password").value.trim()
            };

            fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
            .then(async res => {
                let body = await res.json();

                if (res.status === 401) {
                    errorMessage.textContent = body.error || "Invalid login";
                    errorMessage.style.display = "block";
                    return;
                }

                localStorage.setItem("token", body.token);
                localStorage.setItem("username", body.username);

                window.location.href = "welcome.html";
            })
            .catch(err => {
                console.error("Fetch error:", err);
                errorMessage.textContent = "Network error. Try again.";
                errorMessage.style.display = "block";
            });
        });
    </script>
</body>
</html>
