<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawaii Login</title>
    <link rel="stylesheet" href="index_style.css">
    </head>
<body>
    <div class="login-container">
        <div class="image-placeholder">
            <img src="bunny-graphic.png" alt="Cute Bunny Mascot" class="mascot-image">
            </div>

        <form class="login-form">
            <div class="input-group">
                <i class="icon email-icon">📧</i> <input type="email" value="bear@gmail.com" readonly aria-label="Email address">
            </div>

            <div class="input-group">
                <i class="icon password-icon">🔑</i> <input type="password" value="******" aria-label="Password">
            </div>

            <button type="submit" class="login-button">
                LOGIN WITH EMAIL
            </button>
            
            <p class="forgot-password">
                Forgot Password? <a href="#">Click Here</a>
            </p>
        </form>
    </div>
</body>
</html>
