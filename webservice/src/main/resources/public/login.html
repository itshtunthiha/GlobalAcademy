<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/index-style.css">
    <style>
        /* Error message style */
        .error-message {
            display: none;
            color: #ff4d4f; /* Red */
            margin-top: 10px;
            font-weight: bold;
            animation: shake 0.3s ease;
        }

        /* Shake animation */
        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }

        /* Trigger animation dynamically */
        .error-message.show {
            display: block;
            animation: shake 0.3s ease;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="image-placeholder">
            <img src="imgs/bunny.png" alt="Cute Bunny Mascot" class="mascot-image">
        </div>

        <form id="loginForm" class="login-form">
            <div class="input-group">
                <img class="icon" src="icons/inbox-icon.svg" alt="Email Icon">
                <input type="text" id="username" placeholder="Username or email address" aria-label="Email address">
            </div>

            <div class="input-group">
                <img class="icon" src="icons/password-icon.svg" alt="Password Icon">
                <input type="password" id="password" placeholder="Enter password" aria-label="Password">
            </div>

            <button type="submit" class="login-button">
                LOGIN
            </button>

            <p class="forgot-password">
                Forgot Password? <a href="#">Click Here</a>
            </p>

            <p id="errorMessage" class="error-message">
                Invalid username or password
            </p>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const errorMessage = document.getElementById("errorMessage");

        loginForm.addEventListener("submit", function(e) {
            e.preventDefault();

            // Hide previous error
            errorMessage.classList.remove("show");

            const data = {
                username: document.getElementById("username").value.trim(),
                password: document.getElementById("password").value.trim()
            };

            fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
            .then(async res => {
                let body = await res.json();

                if (res.status === 401) {
                    errorMessage.textContent = body.error || "Invalid username or password";
                    
                    // Trigger shake animation
                    errorMessage.classList.remove("show"); // reset animation
                    void errorMessage.offsetWidth; // force reflow
                    errorMessage.classList.add("show");
                    return;
                }

                localStorage.setItem("token", body.token);
                localStorage.setItem("username", body.username);

                window.location.href = "index.html";
            })
            .catch(err => {
                console.error("Fetch error:", err);
                errorMessage.textContent = "Network error. Try again.";
                errorMessage.classList.remove("show");
                void errorMessage.offsetWidth;
                errorMessage.classList.add("show");
            });
        });
    </script>
</body>
</html>
