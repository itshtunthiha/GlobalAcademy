<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards - NONG MALI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Canva Sans', 'Bricolage Grotesque', sans-serif;
        }

        body {
            background: #fbf3eb;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
            position: relative;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #000;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #000;
            font-size: 18px;
            font-weight: 500;
        }

        a.login-btn {
            background: linear-gradient(135deg, #b41f7d 0%, #b41f7d 100%);
            color: white !important;
            padding: 12px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        a.login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
        }

        a.logout-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        a.logout-btn:hover {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        .title-section {
            text-align: center;
            margin-top: 40px;
        }

        .title-section h1 {
            font-size: 48px;
            font-weight: 800;
            color: #3a2b23;
        }

        .title-section p {
            font-size: 20px;
            margin-top: 12px;
            color: #7c665c;
        }

        .flashcard-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 40px;
            margin-top: 60px;
            padding-bottom: 80px;
        }

        .card {
            width: 260px;
            height: 360px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.7s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: #fff;
            border-radius: 26px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .front-text {
            font-size: 42px;
            color: #3a2b23;
            font-weight: 700;
            text-align: center;
            line-height: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .speaker-icon {
            width: 24px;
            height: 24px;
            cursor: pointer;
            fill: #8a6d63;
            transition: transform 0.2s ease, fill 0.2s ease;
            opacity: 0.6;
        }

        .speaker-icon:hover {
            transform: scale(1.2);
            fill: #b41f7d;
            opacity: 1;
        }

        .pronunciation-text {
            font-size: 16px;
            color: #8a6d63;
            font-style: italic;
            margin-top: 8px;
            text-align: center;
        }

        .click-text {
            margin-top: 18px;
            color: #8a6d63;
            font-size: 16px;
        }

        .card-back {
            background: #35c9d1;
            color: white;
            transform: rotateY(180deg);
            font-size: 34px;
            font-weight: 700;
        }

        /* ------------------------------
           MOBILE RESPONSIVE < 768px
        ------------------------------ */
        @media (max-width: 768px) {

            /* Hamburger */
            .hamburger {
                width: 32px;
                height: 26px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                cursor: pointer;
            }

            .hamburger span {
                height: 4px;
                width: 100%;
                background: #000;
                border-radius: 5px;
                transition: 0.3s ease;
            }

            .hamburger.active span:nth-child(1) {
                transform: translateY(10px) rotate(45deg);
            }

            .hamburger.active span:nth-child(2) {
                opacity: 0;
            }

            .hamburger.active span:nth-child(3) {
                transform: translateY(-10px) rotate(-45deg);
            }

            nav {
                padding: 20px;
                justify-content: space-between;
            }

            /* Mobile nav links */
            .nav-links {
                position: absolute;
                top: 80px;
                right: 20px;
                background: white;
                padding: 20px;
                border-radius: 20px;
                flex-direction: column;
                gap: 20px;
                list-style: none;
                width: 180px;
                display: none;
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
                z-index: 999;
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links a {
                font-size: 18px;
                color: #000;
            }

            /* Keep logout text white */
            .nav-links a.logout-btn {
                color: white !important;
            }

            /* Flashcards container */
            .flashcard-container {
                gap: 20px;
                margin-top: 40px;
            }

            .card {
                width: 200px;
                height: 280px;
            }

            .front-text {
                font-size: 32px;
            }

            .card-back {
                font-size: 26px;
            }

            .title-section h1 {
                font-size: 32px;
            }

            .title-section p {
                font-size: 16px;
            }
        }

        /* Mode Toggle Button */
        .mode-toggle-container {
            text-align: center;
            margin-top: 30px;
        }

        .mode-toggle-btn {
            background: linear-gradient(135deg, #35c9d1 0%, #35c9d1 100%);
            color: white;
            padding: 12px 32px;
            border-radius: 50px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(53, 201, 209, 0.3);
            transition: all 0.3s ease;
        }

        .mode-toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(53, 201, 209, 0.4);
        }

        /* Review Mode Styles */
        .review-mode .flashcard-container {
            flex-direction: column;
            align-items: center;
        }

        .progress-container {
            text-align: center;
            margin-bottom: 30px;
            font-size: 18px;
            color: #7c665c;
            font-weight: 600;
            display: inline-block;
            padding: 10px 30px;
            border-radius: 50px;
        }

        .progress-wrapper {
            text-align: center;
            width: 100%;
            display: none;
        }

        .review-mode .progress-wrapper {
            display: block;
        }

        .next-btn,
        .clear-btn {
            padding: 14px 40px;
            border-radius: 50px;
            border: none;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .next-btn {
            background: linear-gradient(135deg, #b41f7d 0%, #b41f7d 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(180, 31, 125, 0.3);
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(180, 31, 125, 0.4);
        }

        .clear-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
            font-size: 16px;
            padding: 12px 32px;
            font-weight: 600;
            margin-left: 15px;
            margin-right: 15px;
        }

        .clear-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        .next-btn {
            background: linear-gradient(135deg, #b41f7d 0%, #b41f7d 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(180, 31, 125, 0.3);
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(180, 31, 125, 0.4);
        }

        .review-mode .next-btn {
            display: inline-block;
        }

        .button-container {
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .review-mode .button-container {
            display: block;
        }

        .message-container {
            text-align: center;
            margin-top: 40px;
            font-size: 32px;
            color: #3a2b23;
            font-weight: 700;
            display: none;
            animation: fadeInScale 0.6s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .completion-emoji {
            font-size: 64px;
            display: block;
            margin-bottom: 20px;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        /* Confetti Animation */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f0f;
            top: -10px;
            opacity: 0;
        }

        @keyframes confetti-fall {
            0% {
                top: -10%;
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        .message-container.celebrating {
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .celebration-text {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #f7b731, #5f27cd);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 3s ease infinite;
        }

        @keyframes gradient-shift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Swipe Animations - REMOVED to prevent conflicts with drag gestures */

        /* Previous Button */
        .prev-btn {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(75, 85, 99, 0.3);
            display: none;
            /* Hidden by default */
            font-size: 16px;
            padding: 12px 32px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .prev-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(75, 85, 99, 0.4);
        }

        .prev-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .review-mode .prev-btn {
            display: inline-block;
        }

        /* Draggable Card Styles */
        .card.dragging {
            transition: none !important;
            /* Disable transition while dragging for instant response */
            cursor: grabbing;
            transform-origin: center center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            z-index: 100;
            /* Ensure dragged card is on top */
        }

        /* Card Navigation Animations */
        @keyframes slideOutLeft {
            to {
                transform: translateX(-120%) rotate(-20deg);
                opacity: 0;
            }
        }

        @keyframes slideOutRight {
            to {
                transform: translateX(120%) rotate(20deg);
                opacity: 0;
            }
        }

        @keyframes slideInLeft {
            from {
                transform: translateX(-120%) rotate(-20deg);
                opacity: 0;
            }

            to {
                transform: translateX(0) rotate(0);
                opacity: 1;
            }
        }

        @keyframes slideInRight {
            from {
                transform: translateX(120%) rotate(20deg);
                opacity: 0;
            }

            to {
                transform: translateX(0) rotate(0);
                opacity: 1;
            }
        }

        .card.slide-out-left {
            animation: slideOutLeft 0.4s ease-in forwards;
        }

        .card.slide-out-right {
            animation: slideOutRight 0.4s ease-in forwards;
        }

        .card.slide-in-left {
            animation: slideInLeft 0.4s ease-out forwards;
        }

        .card.slide-in-right {
            animation: slideInRight 0.4s ease-out forwards;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: #3a2b23;
            margin-bottom: 15px;
        }

        .modal-message {
            font-size: 16px;
            color: #7c665c;
            margin-bottom: 30px;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-btn {
            padding: 12px 30px;
            border-radius: 50px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn-cancel {
            background: #f3f4f6;
            color: #3a2b23;
        }

        .modal-btn-cancel:hover {
            background: #e5e7eb;
            transform: translateY(-2px);
        }

        .modal-btn-confirm {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .modal-btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">NONG MALI</div>

        <!-- Hamburger -->
        <div class="hamburger" id="hamburgerMenu">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="flashcards.html">Play game</a></li>
            <li><a href="login.html" class="login-btn" id="authBtn">Login</a></li>
        </ul>
    </nav>

    <div class="title-section">
        <h1>Try Our Flashcards</h1>
        <p id="subtitle">Click on any card to flip it and see the translation!</p>
    </div>

    <div class="mode-toggle-container">
        <button class="mode-toggle-btn" id="modeToggleBtn">Switch to Review Mode</button>
    </div>

    <div class="message-container" id="messageContainer"></div>

    <div class="progress-wrapper">
        <div class="progress-container" id="progressContainer">
            Progress: <span id="progressText">0 / 0</span>
        </div>
    </div>

    <div class="flashcard-container" id="flashcardContainer"></div>

    <div class="button-container">
        <button class="prev-btn" id="prevBtn">Previous</button>
        <button class="clear-btn" id="clearBtn">Clear Progress</button>
        <button class="next-btn" id="nextBtn">Next Card</button>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-content">
            <div class="modal-title">Clear Progress?</div>
            <div class="modal-message">Are you sure you want to clear your progress? This action cannot be undone.</div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" id="modalCancel">Cancel</button>
                <button class="modal-btn modal-btn-confirm" id="modalConfirm">Clear Progress</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "login.html";

        // Mode state
        let isReviewMode = false;
        let currentBatch = [];
        let currentBatchIndex = 0;
        let totalReviewed = 0;
        let totalCount = 0;

        // DOM elements
        const container = document.getElementById("flashcardContainer");
        const nextBtn = document.getElementById("nextBtn");
        const prevBtn = document.getElementById("prevBtn");
        const clearBtn = document.getElementById("clearBtn");
        const messageContainer = document.getElementById("messageContainer");
        const progressText = document.getElementById("progressText");
        const modeToggleBtn = document.getElementById("modeToggleBtn");
        const subtitle = document.getElementById("subtitle");
        const progressContainer = document.getElementById("progressContainer");


        function speakText(event, text) {
            event.stopPropagation(); // Prevent card flip
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'th-TH'; // Thai language
            window.speechSynthesis.speak(utterance);
        }

        function createCard(front, back, pronunciation) {
            return `
                <div class="card">
                    <div class="card-inner">
                        <div class="card-face card-front">
                            <div class="front-text">
                                ${front}
                                <svg class="speaker-icon" data-text="${front}" viewBox="0 0 24 24">
                                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                                </svg>
                            </div>
                            <div class="pronunciation-text">${pronunciation || ''}</div>
                            <div class="click-text">Click to flip</div>
                        </div>
                        <div class="card-face card-back">${back}</div>
                    </div>
                </div>
            `;
        }

        // View All Mode
        async function loadDefaultCards() {
            const res = await fetch("/flashcards/default", {
                headers: { "Authorization": "Bearer " + token }
            });

            const cards = await res.json();
            container.innerHTML = '';
            cards.forEach(c => {
                container.innerHTML += createCard(c.front, c.back, c.pronunciation);
            });

            // Add click listeners for card flipping in View All mode
            attachCardFlipListeners();
        }

        // Attach click listeners to flip cards (for View All mode)
        function attachCardFlipListeners() {
            const cards = container.querySelectorAll('.card');
            cards.forEach(card => {
                card.addEventListener('click', (e) => {
                    // Don't flip if clicking on the speaker icon or its path
                    if (e.target.closest('.speaker-icon')) {
                        e.stopPropagation();
                        return;
                    }
                    card.classList.toggle('flipped');
                });
            });

            // Add speaker icon click handlers
            const speakerIcons = container.querySelectorAll('.speaker-icon');
            speakerIcons.forEach(icon => {
                icon.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const text = icon.getAttribute('data-text');
                    if (text) {
                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.lang = 'th-TH';
                        window.speechSynthesis.speak(utterance);
                    }
                });
            });
        }

        // Review Mode
        async function loadNextBatch() {
            const res = await fetch("/flashcards/randbatch", {
                headers: { "Authorization": "Bearer " + token }
            });

            if (res.status === 401) {
                window.location.href = "login.html";
                return;
            }

            const data = await res.json();
            currentBatch = data.cards;
            totalCount = data.totalCount;
            totalReviewed = data.reviewedCount; // Use server's count directly

            if (currentBatch.length === 0) {
                showCompletion();
                return;
            }

            currentBatchIndex = 0;
            showCurrentCard('next');
        }

        function showCurrentCard(direction = 'next', animate = false) {
            if (currentBatchIndex >= currentBatch.length) {
                loadNextBatch();
                return;
            }

            const card = currentBatch[currentBatchIndex];
            const cardHTML = createCard(card.front, card.back, card.pronunciation);

            // Simply replace the card without animations to avoid conflicts with drag gestures
            container.innerHTML = cardHTML;

            // Apply enter animation if requested
            if (animate) {
                const newCard = container.querySelector('.card');
                if (newCard) {
                    if (direction === 'next') {
                        newCard.classList.add('slide-in-right');
                    } else if (direction === 'prev') {
                        newCard.classList.add('slide-in-left');
                    }
                }
            }

            // Add speaker icon click handler for Review Mode
            const speakerIcon = container.querySelector('.speaker-icon');
            if (speakerIcon) {
                speakerIcon.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const text = speakerIcon.getAttribute('data-text');
                    if (text) {
                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.lang = 'th-TH';
                        window.speechSynthesis.speak(utterance);
                    }
                });
            }

            let currentProgress = totalReviewed + currentBatchIndex;
            progressText.textContent = `${currentProgress} / ${totalCount}`;
            progressContainer.style.display = "block";

            updateButtons();
        }

        function updateButtons() {
            // Enable/Disable Previous button
            prevBtn.disabled = currentBatchIndex === 0;

            // Show/Hide Clear button (only show if progress > 0)
            if (totalReviewed + currentBatchIndex > 0) {
                clearBtn.style.display = "inline-block";
            } else {
                clearBtn.style.display = "none";
            }
        }

        function showCompletion() {
            container.innerHTML = '';
            progressContainer.style.display = "none";
            messageContainer.style.display = "block";
            messageContainer.classList.add('celebrating');
            messageContainer.innerHTML = `
                <span class="completion-emoji">🎉</span>
                <div class="celebration-text">Congratulations!</div>
                <div style="font-size: 20px; margin-top: 15px; color: #7c665c;">You've reviewed all your flashcards!</div>
            `;
            nextBtn.style.display = "none";
            prevBtn.style.display = "none";
            clearBtn.style.display = "inline-block";

            // Trigger confetti animation
            createConfetti();
        }

        function createConfetti() {
            // Create confetti container if it doesn't exist
            let confettiContainer = document.querySelector('.confetti-container');
            if (!confettiContainer) {
                confettiContainer = document.createElement('div');
                confettiContainer.className = 'confetti-container';
                document.body.appendChild(confettiContainer);
            }

            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f7b731', '#5f27cd', '#ff9ff3', '#54a0ff', '#48dbfb'];
            const confettiCount = 100;

            for (let i = 0; i < confettiCount; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = (Math.random() * 10 + 5) + 'px';
                    confetti.style.height = (Math.random() * 10 + 5) + 'px';
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.animation = `confetti-fall ${Math.random() * 3 + 2}s linear forwards`;
                    confetti.style.transform = `rotate(${Math.random() * 360}deg)`;

                    confettiContainer.appendChild(confetti);

                    // Remove confetti after animation
                    setTimeout(() => {
                        confetti.remove();
                    }, 5000);
                }, i * 30);
            }

            // Remove container after all confetti is done
            setTimeout(() => {
                if (confettiContainer && confettiContainer.children.length === 0) {
                    confettiContainer.remove();
                }
            }, 8000);
        }

        // Mode Toggle
        modeToggleBtn.onclick = () => {
            isReviewMode = !isReviewMode;
            document.body.classList.toggle('review-mode', isReviewMode);

            if (isReviewMode) {
                modeToggleBtn.textContent = "Switch to View All";
                modeToggleBtn.classList.add('active');
                subtitle.textContent = "Review Mode: One by one";
                messageContainer.style.display = "none";

                // Reset inline styles so CSS classes can control visibility
                nextBtn.style.display = "";
                prevBtn.style.display = "";
                clearBtn.style.display = "";

                loadNextBatch();
            } else {
                modeToggleBtn.textContent = "Switch to Review Mode";
                modeToggleBtn.classList.remove('active');
                subtitle.textContent = "Master your Thai vocabulary";
                progressContainer.style.display = "none";
                messageContainer.style.display = "none";
                nextBtn.style.display = "none";
                prevBtn.style.display = "none";
                clearBtn.style.display = "none";
                loadDefaultCards();
            }
        };

        // Next button
        nextBtn.onclick = async () => {
            if (currentBatchIndex >= currentBatch.length) return;

            // Mark current card as reviewed
            const currentCard = currentBatch[currentBatchIndex];
            // We don't await this to keep UI responsive, but we should probably handle errors if needed
            fetch("/flashcards/mark_reviewed", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ cardFront: currentCard.front })
            });

            const cardElement = container.querySelector('.card');
            if (cardElement) {
                cardElement.classList.add('slide-out-left');
                // Wait for animation
                setTimeout(() => {
                    currentBatchIndex++;
                    showCurrentCard('next', true);
                }, 300); // Slightly less than animation duration to feel snappy
            } else {
                currentBatchIndex++;
                showCurrentCard('next', true);
            }
        };

        // Previous button
        prevBtn.onclick = () => {
            if (currentBatchIndex > 0) {
                const cardElement = container.querySelector('.card');
                if (cardElement) {
                    cardElement.classList.add('slide-out-right');
                    setTimeout(() => {
                        currentBatchIndex--;
                        showCurrentCard('prev', true);
                    }, 300);
                } else {
                    currentBatchIndex--;
                    showCurrentCard('prev', true);
                }
            }
        };

        // Clear Progress button
        clearBtn.onclick = () => {
            // Show modal instead of browser confirm
            document.getElementById('confirmModal').classList.add('active');
        };

        // Modal handlers
        const confirmModal = document.getElementById('confirmModal');
        const modalCancel = document.getElementById('modalCancel');
        const modalConfirm = document.getElementById('modalConfirm');

        modalCancel.onclick = () => {
            confirmModal.classList.remove('active');
        };

        modalConfirm.onclick = async () => {
            confirmModal.classList.remove('active');

            await fetch("/flashcards/clear_progress", {
                method: "POST",
                headers: { "Authorization": "Bearer " + token }
            });

            currentBatch = [];
            currentBatchIndex = 0;
            totalReviewed = 0;
            messageContainer.style.display = "none";
            clearBtn.style.display = "none";

            loadNextBatch();
        };

        // Close modal when clicking outside
        confirmModal.onclick = (e) => {
            if (e.target === confirmModal) {
                confirmModal.classList.remove('active');
            }
        };

        // Initialize with View All mode
        loadDefaultCards();

        // Auth button
        const username = localStorage.getItem("username");
        const authBtn = document.getElementById("authBtn");

        if (username) {
            authBtn.textContent = "Logout";
            authBtn.classList.add('logout-btn');
            authBtn.onclick = () => {
                localStorage.clear();
                window.location.href = "login.html";
            };
        } else {
            authBtn.textContent = 'Login';
            authBtn.classList.remove('logout-btn');
        }

        // Hamburger toggle
        const hamburger = document.getElementById("hamburgerMenu");
        const navLinks = document.querySelector(".nav-links");

        hamburger.addEventListener("click", () => {
            hamburger.classList.toggle("active");
            navLinks.classList.toggle("active");
        });

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (!isReviewMode) return;

            // Space or Enter to flip card
            if ((e.code === 'Space' || e.code === 'Enter') && !document.getElementById('confirmModal').classList.contains('active')) {
                e.preventDefault(); // Prevent scrolling
                const card = document.querySelector('.card');
                if (card) card.classList.toggle('flipped');
            }

            // Right Arrow for Next Card
            if (e.code === 'ArrowRight' && !document.getElementById('confirmModal').classList.contains('active')) {
                nextBtn.click();
            }

            // Left Arrow for Previous Card
            if (e.code === 'ArrowLeft' && !document.getElementById('confirmModal').classList.contains('active')) {
                if (!prevBtn.disabled) prevBtn.click();
            }

            // Escape to close modal
            if (e.code === 'Escape') {
                document.getElementById('confirmModal').classList.remove('active');
            }
        });

        // Swipe & Drag Gestures (Interactive Tinder-style)
        let startX = 0;
        let currentX = 0;
        let isDragging = false;
        let cardElement = null;
        let dragStartTime = 0;

        // Touch Events
        container.addEventListener('touchstart', (e) => {
            if (!isReviewMode) return;
            // Don't start drag if touching speaker icon
            if (e.target.closest('.speaker-icon')) return;
            startDrag(e.touches[0].clientX);
        }, { passive: false });

        container.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault(); // Prevent scrolling while dragging
            moveDrag(e.touches[0].clientX);
        }, { passive: false });

        container.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            endDrag();
        });

        // Mouse Events
        container.addEventListener('mousedown', (e) => {
            if (!isReviewMode) return;
            // Don't start drag if clicking speaker icon
            if (e.target.closest('.speaker-icon')) return;
            e.preventDefault(); // Prevent text selection
            startDrag(e.clientX);
        });

        container.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            moveDrag(e.clientX);
        });

        container.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            endDrag();
        });

        container.addEventListener('mouseleave', () => {
            if (isDragging) endDrag();
        });

        function startDrag(x) {
            // Find the card element
            cardElement = container.querySelector('.card');

            if (!cardElement) return;

            isDragging = true;
            startX = x;
            currentX = x;
            dragStartTime = Date.now();

            // Add dragging class for visual feedback
            cardElement.classList.add('dragging');
        }

        function moveDrag(x) {
            if (!cardElement) return;
            currentX = x;
            const diffX = currentX - startX;
            const rotation = diffX * 0.1; // Rotate slightly based on drag distance

            cardElement.style.transform = `translateX(${diffX}px) rotate(${rotation}deg) scale(1.05)`;
        }

        function endDrag() {
            if (!cardElement) return;
            isDragging = false;
            cardElement.classList.remove('dragging');

            const diffX = currentX - startX;
            const threshold = 100; // Drag threshold to trigger action
            const dragDuration = Date.now() - dragStartTime;

            // If drag was very short and quick, treat as click (flip)
            if (Math.abs(diffX) < 10 && dragDuration < 200) {
                cardElement.classList.toggle('flipped');
                resetCard();
                return;
            }

            if (diffX > threshold) {
                // Dragged Right -> Previous
                if (!prevBtn.disabled) {
                    cardElement.style.transform = `translateX(1000px) rotate(30deg)`; // Fly off
                    setTimeout(() => prevBtn.click(), 200);
                } else {
                    resetCard();
                }
            } else if (diffX < -threshold) {
                // Dragged Left -> Next
                cardElement.style.transform = `translateX(-1000px) rotate(-30deg)`; // Fly off
                setTimeout(() => nextBtn.click(), 200);
            } else {
                // Snap back
                resetCard();
            }

            startX = 0;
            currentX = 0;
        }

        function resetCard() {
            if (cardElement) {
                // Add transition for smooth snap-back
                cardElement.style.transition = 'transform 0.3s ease';
                cardElement.style.transform = '';

                // Remove transition after animation completes to not interfere with future drags
                setTimeout(() => {
                    if (cardElement) {
                        cardElement.style.transition = '';
                    }
                }, 300);
            }
        }
    </script>
