<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards - NONG MALI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Canva Sans', 'Bricolage Grotesque', sans-serif;
        }

        body {
            background: #fbf3eb;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
            position: relative;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #000;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #000;
            font-size: 18px;
            font-weight: 500;
        }

        a.login-btn {
            background: linear-gradient(135deg, #b41f7d 0%, #b41f7d 100%);
            color: white !important;
            padding: 12px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        a.login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
        }

        a.logout-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        a.logout-btn:hover {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        .title-section {
            text-align: center;
            margin-top: 40px;
        }

        .title-section h1 {
            font-size: 48px;
            font-weight: 800;
            color: #3a2b23;
        }

        .title-section p {
            font-size: 20px;
            margin-top: 12px;
            color: #7c665c;
        }

        .flashcard-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 40px;
            margin-top: 60px;
            padding-bottom: 80px;
        }

        .card {
            width: 260px;
            height: 360px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.7s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: #fff;
            border-radius: 26px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .front-text {
            font-size: 42px;
            color: #3a2b23;
            font-weight: 700;
            text-align: center;
            line-height: 1.2;
        }

        .pronunciation-text {
            font-size: 16px;
            color: #8a6d63;
            font-style: italic;
            margin-top: 8px;
            text-align: center;
        }

        .click-text {
            margin-top: 18px;
            color: #8a6d63;
            font-size: 16px;
        }

        .card-back {
            background: #35c9d1;
            color: white;
            transform: rotateY(180deg);
            font-size: 34px;
            font-weight: 700;
        }

        /* ------------------------------
           MOBILE RESPONSIVE < 768px
        ------------------------------ */
        @media (max-width: 768px) {

            /* Hamburger */
            .hamburger {
                width: 32px;
                height: 26px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                cursor: pointer;
            }

            .hamburger span {
                height: 4px;
                width: 100%;
                background: #000;
                border-radius: 5px;
                transition: 0.3s ease;
            }

            .hamburger.active span:nth-child(1) {
                transform: translateY(10px) rotate(45deg);
            }

            .hamburger.active span:nth-child(2) {
                opacity: 0;
            }

            .hamburger.active span:nth-child(3) {
                transform: translateY(-10px) rotate(-45deg);
            }

            nav {
                padding: 20px;
                justify-content: space-between;
            }

            /* Mobile nav links */
            .nav-links {
                position: absolute;
                top: 80px;
                right: 20px;
                background: white;
                padding: 20px;
                border-radius: 20px;
                flex-direction: column;
                gap: 20px;
                list-style: none;
                width: 180px;
                display: none;
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
                z-index: 999;
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links a {
                font-size: 18px;
                color: #000;
            }

            /* Keep logout text white */
            .nav-links a.logout-btn {
                color: white !important;
            }

            /* Flashcards container */
            .flashcard-container {
                gap: 20px;
                margin-top: 40px;
            }

            .card {
                width: 200px;
                height: 280px;
            }

            .front-text {
                font-size: 32px;
            }

            .card-back {
                font-size: 26px;
            }

            .title-section h1 {
                font-size: 32px;
            }

            .title-section p {
                font-size: 16px;
            }
        }

        /* Mode Toggle Button */
        .mode-toggle-container {
            text-align: center;
            margin-top: 30px;
        }

        .mode-toggle-btn {
            background: linear-gradient(135deg, #35c9d1 0%, #35c9d1 100%);
            color: white;
            padding: 12px 32px;
            border-radius: 50px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(53, 201, 209, 0.3);
            transition: all 0.3s ease;
        }

        .mode-toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(53, 201, 209, 0.4);
        }

        /* Review Mode Styles */
        .review-mode .flashcard-container {
            flex-direction: column;
            align-items: center;
        }

        .progress-container {
            text-align: center;
            margin-bottom: 30px;
            font-size: 18px;
            color: #7c665c;
            font-weight: 600;
            display: inline-block;
            padding: 10px 30px;
            border-radius: 50px;
        }

        .progress-wrapper {
            text-align: center;
            width: 100%;
            display: none;
        }

        .review-mode .progress-wrapper {
            display: block;
        }

        .next-btn,
        .clear-btn {
            padding: 14px 40px;
            border-radius: 50px;
            border: none;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .next-btn {
            background: linear-gradient(135deg, #b41f7d 0%, #b41f7d 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(180, 31, 125, 0.3);
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(180, 31, 125, 0.4);
        }

        .clear-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
            font-size: 16px;
            padding: 12px 32px;
            font-weight: 600;
        }

        .clear-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        .next-btn {
            background: linear-gradient(135deg, #b41f7d 0%, #b41f7d 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(180, 31, 125, 0.3);
            margin-left: 15px;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(180, 31, 125, 0.4);
        }

        .review-mode .next-btn {
            display: inline-block;
        }

        .button-container {
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .review-mode .button-container {
            display: block;
        }

        .message-container {
            text-align: center;
            margin-top: 40px;
            font-size: 32px;
            color: #3a2b23;
            font-weight: 700;
            display: none;
            animation: fadeInScale 0.6s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .completion-emoji {
            font-size: 64px;
            display: block;
            margin-bottom: 20px;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">NONG MALI</div>

        <!-- Hamburger -->
        <div class="hamburger" id="hamburgerMenu">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="flashcards.html">Play game</a></li>
            <li><a href="login.html" class="login-btn" id="authBtn">Login</a></li>
        </ul>
    </nav>

    <div class="title-section">
        <h1>Try Our Flashcards</h1>
        <p id="subtitle">Click on any card to flip it and see the translation!</p>
    </div>

    <div class="mode-toggle-container">
        <button class="mode-toggle-btn" id="modeToggleBtn">Switch to Review Mode</button>
    </div>

    <div class="message-container" id="messageContainer"></div>

    <div class="progress-wrapper">
        <div class="progress-container" id="progressContainer">
            Progress: <span id="progressText">0 / 0</span>
        </div>
    </div>

    <div class="flashcard-container" id="flashcardContainer"></div>

    <div class="button-container">
        <button class="clear-btn" id="clearBtn">Clear Progress</button>
        <button class="next-btn" id="nextBtn">Next Card</button>
    </div>

    <script>
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "login.html";

        // Mode state
        let isReviewMode = false;
        let currentBatch = [];
        let currentBatchIndex = 0;
        let totalReviewed = 0;
        let totalCount = 0;

        // DOM elements
        const container = document.getElementById("flashcardContainer");
        const messageContainer = document.getElementById("messageContainer");
        const progressText = document.getElementById("progressText");
        const nextBtn = document.getElementById("nextBtn");
        const clearBtn = document.getElementById("clearBtn");
        const modeToggleBtn = document.getElementById("modeToggleBtn");
        const subtitle = document.getElementById("subtitle");

        function createCard(front, back, pronunciation) {
            return `
                <div class="card" onclick="this.classList.toggle('flipped')">
                    <div class="card-inner">
                        <div class="card-face card-front">
                            <div class="front-text">${front}</div>
                            <div class="pronunciation-text">${pronunciation || ''}</div>
                            <div class="click-text">Click to flip</div>
                        </div>
                        <div class="card-face card-back">${back}</div>
                    </div>
                </div>
            `;
        }

        // View All Mode
        async function loadDefaultCards() {
            const res = await fetch("/flashcards/default", {
                headers: { "Authorization": "Bearer " + token }
            });

            const cards = await res.json();
            container.innerHTML = '';
            cards.forEach(c => {
                container.innerHTML += createCard(c.front, c.back, c.pronunciation);
            });
        }

        // Review Mode
        async function loadNextBatch() {
            const res = await fetch("/flashcards/randbatch", {
                headers: { "Authorization": "Bearer " + token }
            });

            if (res.status === 401) {
                window.location.href = "login.html";
                return;
            }

            const data = await res.json();
            currentBatch = data.cards;
            totalCount = data.totalCount;
            totalReviewed = data.reviewedCount; // Use server's count directly

            if (currentBatch.length === 0) {
                showCompletion();
                return;
            }

            currentBatchIndex = 0;
            showCurrentCard();
        }

        function showCurrentCard() {
            if (currentBatchIndex >= currentBatch.length) {
                loadNextBatch();
                return;
            }

            const card = currentBatch[currentBatchIndex];
            container.innerHTML = createCard(card.front, card.back, card.pronunciation);

            let currentProgress = totalReviewed + currentBatchIndex;
            progressText.textContent = `${currentProgress} / ${totalCount}`;

            nextBtn.style.display = "inline-block";
            updateClearButton();
        }

        function showCompletion() {
            container.innerHTML = "";
            nextBtn.style.display = "none";
            progressText.textContent = `${totalCount} / ${totalCount}`;
            messageContainer.innerHTML = '<span class="completion-emoji">🎉</span>You have mastered all the cards!';
            messageContainer.style.display = "block";
            clearBtn.style.display = "inline-block";
        }

        function updateClearButton() {
            if (totalReviewed > 0 || currentBatchIndex > 0) {
                clearBtn.style.display = "inline-block";
            }
        }

        // Mode Toggle
        modeToggleBtn.onclick = () => {
            isReviewMode = !isReviewMode;
            document.body.classList.toggle('review-mode', isReviewMode);

            if (isReviewMode) {
                modeToggleBtn.textContent = "Switch to View All";
                subtitle.textContent = "Learn new words one by one!";
                messageContainer.style.display = "none";
                loadNextBatch();
            } else {
                modeToggleBtn.textContent = "Switch to Review Mode";
                subtitle.textContent = "Click on any card to flip it and see the translation!";
                messageContainer.style.display = "none";
                clearBtn.style.display = "none";
                loadDefaultCards();
            }
        };

        // Next button
        nextBtn.onclick = async () => {
            // Mark current card as reviewed before moving to next
            if (currentBatchIndex < currentBatch.length) {
                const currentCard = currentBatch[currentBatchIndex];
                await fetch("/flashcards/mark_reviewed", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + token,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ cardFront: currentCard.front })
                });
            }

            currentBatchIndex++;
            showCurrentCard();
        };

        // Clear Progress button
        clearBtn.onclick = async () => {
            if (confirm("Are you sure you want to clear your progress?")) {
                await fetch("/flashcards/clear_progress", {
                    method: "POST",
                    headers: { "Authorization": "Bearer " + token }
                });

                currentBatch = [];
                currentBatchIndex = 0;
                totalReviewed = 0;
                messageContainer.style.display = "none";
                clearBtn.style.display = "none";

                loadNextBatch();
            }
        };

        // Initialize with View All mode
        loadDefaultCards();

        // Auth button
        const username = localStorage.getItem("username");
        const authBtn = document.getElementById("authBtn");

        if (username) {
            authBtn.textContent = "Logout";
            authBtn.classList.add('logout-btn');
            authBtn.onclick = () => {
                localStorage.clear();
                window.location.href = "login.html";
            };
        } else {
            authBtn.textContent = 'Login';
            authBtn.classList.remove('logout-btn');
        }

        // Hamburger toggle
        const hamburger = document.getElementById("hamburgerMenu");
        const navLinks = document.querySelector(".nav-links");

        hamburger.addEventListener("click", () => {
            hamburger.classList.toggle("active");
            navLinks.classList.toggle("active");
        });
    </script>
</body>

</html>
